<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LokMitra AI - eKYC Verification</title>
    <style>
      :root {
        --primary: #2563eb;
        --success: #16a34a;
        --error: #dc2626;
        --background: #0f172a;
        --text: #f8fafc;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--background);
        color: var(--text);
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      header {
        width: 100%;
        padding: 1rem;
        background-color: rgba(255, 255, 255, 0.05);
        text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        margin-bottom: 2rem;
      }

      h1 {
        margin: 0;
        font-weight: 600;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        width: 100%;
        max-width: 800px;
        padding: 0 1rem;
      }

      .video-wrapper {
        position: relative;
        width: 640px;
        height: 480px;
        background-color: black;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        border: 2px solid rgba(255, 255, 255, 0.1);
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1); /* Mirror effect */
      }

      .controls {
        display: flex;
        gap: 1rem;
      }

      button {
        padding: 0.75rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }

      #startBtn {
        background-color: var(--primary);
        color: white;
      }

      #startBtn:hover {
        background-color: #1d4ed8;
      }

      #startBtn:disabled {
        background-color: #475569;
        cursor: not-allowed;
      }

      .status-box {
        padding: 1rem;
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        text-align: center;
        min-height: 80px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      #statusText {
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
        font-weight: 500;
      }

      #resultText {
        font-size: 1rem;
        color: #94a3b8;
      }

      .loader {
        display: none;
        width: 24px;
        height: 24px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s ease-in-out infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>LokMitra AI Authentication</h1>
    </header>

    <div class="container">
      <div class="video-wrapper">
        <img src="{{ url_for('video_feed') }}" alt="Video Stream" />
      </div>

      <div class="controls">
        <button id="startBtn" onclick="startVerification()">
          Start Verification
        </button>
      </div>

      <div class="status-box">
        <div id="statusText">Ready</div>
        <div id="resultText">Click 'Start Verification' to begin.</div>
        <div class="loader" id="loader"></div>
      </div>
    </div>

    <script>
      let pollingInterval;

      async function startVerification() {
        const btn = document.getElementById("startBtn");
        const status = document.getElementById("statusText");
        const result = document.getElementById("resultText");
        const loader = document.getElementById("loader");

        btn.disabled = true;
        status.innerText = "Initializing...";
        result.innerText = "";

        try {
          const response = await fetch("/start_process");
          const data = await response.json();

          if (data.status === "started") {
            status.innerText = "Follow Instructions on Video";
            result.innerText = "Recording in progress...";
            pollStatus();
          } else {
            status.innerText = "Error";
            result.innerText = "Could not start process.";
            btn.disabled = false;
          }
        } catch (err) {
          console.error(err);
          btn.disabled = false;
        }
      }

      function pollStatus() {
        const status = document.getElementById("statusText");
        const result = document.getElementById("resultText");
        const btn = document.getElementById("startBtn");
        const loader = document.getElementById("loader");

        pollingInterval = setInterval(async () => {
          try {
            const res = await fetch("/get_result");
            const data = await res.json();

            if (data.status === "processing") {
              status.innerText = "Processing Video...";
              result.innerText = "Verifying liveness and identity...";
              loader.style.display = "block";
            } else if (data.status === "recording") {
              status.innerText = "Recording...";
              const timeLeft = data.time_left || 0;
              result.innerText = `Please move your head as instructed. (${timeLeft}s)`;
            } else if (data.status === "completed") {
              clearInterval(pollingInterval);
              loader.style.display = "none";
              btn.disabled = false;

              status.innerText = "Verification Complete";

              let outputHtml = "";
              if (data.result.verified) {
                status.style.color = "var(--success)";
                status.innerText = "Identity Verified ✅";
                outputHtml = `Match: ${(data.result.distance * 100).toFixed(
                  2
                )}% | Model: ${data.result.model}`;
              } else {
                status.style.color = "var(--error)";
                status.innerText = "Verification Failed ❌";
                outputHtml = `Reason: ${data.result.reason || "No Match"}`;
              }
              result.innerHTML = outputHtml;
            } else if (data.status === "failed") {
              clearInterval(pollingInterval);
              loader.style.display = "none";
              btn.disabled = false;
              status.style.color = "var(--error)";
              status.innerText = "Error Occurred";
              result.innerText = data.error;
            }
          } catch (e) {
            console.error(e);
          }
        }, 1000);
      }
    </script>
  </body>
</html>
